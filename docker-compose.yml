services:
  # ============================================================================
  # 1. PostgreSQL Database (State, Scans, Vulnerabilities)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: lucid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lucid_ci
      POSTGRES_USER: lucid
      POSTGRES_PASSWORD: lucid_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./platform/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucid -d lucid_ci"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lucid-net

  # ============================================================================
  # 2. LocalStack (AWS SQS Mock Service)
  # ============================================================================
  localstack:
    image: localstack/localstack:3.4
    container_name: lucid-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/localstack:/etc/localstack/init/ready.d:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lucid-net

  # ============================================================================
  # 3. AI Remediation & Dynamic Sandbox Service (Python FastAPI)
  # ============================================================================
  ai-service:
    build:
      context: ./infra-ai
      dockerfile: Dockerfile
    container_name: lucid-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=development
      - LLM_PRIMARY_PROVIDER=${LLM_PRIMARY_PROVIDER:-groq}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-gemini}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SANDBOX_IMAGE_TAG=lucid-sandbox-runner:latest
    volumes:
      # Mount host docker socket so the orchestrator can launch runner containers
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/lucid-sandboxes:/tmp/lucid-sandboxes
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lucid-net

networks:
  lucid-net:
    name: lucid-net
    driver: bridge

volumes:
  postgres_data:
